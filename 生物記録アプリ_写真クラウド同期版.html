const app = initializeApp(firebaseConfig);

/* =========================

let selectedColor = "";

let currentSort =

    || "registered";


/* =========================

const colorValues = {

    "赤": "#E74C3C",

    "緑": "#2ECC71",

/* =========================
   並び替え
========================= */

function changeSort() {

    currentSort =
        document.getElementById("sortSelect").value;

    localStorage.setItem(
        "organismSort",
        currentSort
    );

    showList();

}


/* =========================
   データ取得
   indexも一緒に保持する
========================= */

function getOrganisms() {
    return JSON.parse(localStorage.getItem("organisms")) || [];
}

function setOrganisms(organisms) {
    localStorage.setItem("organisms", JSON.stringify(organisms));
}

function getEntries() {

    const organisms = getOrganisms();

    return organisms.map(
        function(organism, index) {

            return {
                organism: organism,
                index: index
            };

        }
    );

}


/* =========================
   並び替え
========================= */

function sortEntries(entries) {

    const result = entries.slice();

    if (currentSort === "japaneseAsc") {

        result.sort(function(a, b) {

            return (a.organism.japaneseName || "")
                .localeCompare(
                    b.organism.japaneseName || "",
                    "ja"
                );

        });

    }


    if (currentSort === "japaneseDesc") {

        result.sort(function(a, b) {

            return (b.organism.japaneseName || "")
                .localeCompare(
                    a.organism.japaneseName || "",
                    "ja"
                );

        });

    }


    if (currentSort === "scientificAsc") {

        result.sort(function(a, b) {

            return (a.organism.scientificName || "")
                .localeCompare(
                    b.organism.scientificName || "",
                    "ja"
                );

        });

    }


    if (currentSort === "scientificDesc") {

        result.sort(function(a, b) {

            return (b.organism.scientificName || "")
                .localeCompare(
                    a.organism.scientificName || "",
                    "ja"
                );

        });

    }


    return result;

}


/* =========================
   色を選択
========================= */

function selectColor(color) {

    selectedColor = color;

    const buttons =
        document.querySelectorAll(
            ".color-button"
        );

    buttons.forEach(function(button) {

        button.classList.remove("selected");

        if (
            button.dataset.color === color
        ) {

            button.classList.add("selected");

        }

    });

}


/* =========================
   写真プレビュー
========================= */

function previewPhoto() {

    const file =
        document.getElementById("photo").files[0];

    if (!file) {

        return;

    }

    const reader =
        new FileReader();

    reader.onload = function(e) {

        const img =
            document.createElement("img");

        img.src = e.target.result;

        img.style.maxWidth = "300px";

        img.style.maxHeight = "300px";

        img.style.objectFit = "contain";

        document
            .getElementById("photoPreview")
            .innerHTML = "";

        document
            .getElementById("photoPreview")
            .appendChild(img);

    };

    reader.readAsDataURL(file);

}


/* =========================
   写真を圧縮
========================= */

function compressImage(
    file,
    callback
) {

    const reader = new FileReader();

    reader.onload = function(e) {

        const img = new Image();

        img.onload = function() {

            // Firestoreの1MiB制限に余裕を持たせるため、
            // 写真データは最大約650,000文字を目安に圧縮します。
            const maxDataUrlLength = 650000;
            const sizes = [900, 800, 700, 600];
            const qualities = [0.65, 0.55, 0.45, 0.35];

            let compressed = "";

            for (let s = 0; s < sizes.length; s++) {
                let width = img.width;
                let height = img.height;
                const maxSize = sizes[s];

                if (width > height) {
                    if (width > maxSize) {
                        height = height * maxSize / width;
                        width = maxSize;
                    }
                } else {
                    if (height > maxSize) {
                        width = width * maxSize / height;
                        height = maxSize;
                    }
                }

                const canvas = document.createElement("canvas");
                canvas.width = Math.round(width);
                canvas.height = Math.round(height);

                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                for (let q = 0; q < qualities.length; q++) {
                    compressed = canvas.toDataURL("image/jpeg", qualities[q]);
                    if (compressed.length <= maxDataUrlLength) {
                        callback(compressed);
                        return;
                    }
                }
            }

            // それでも大きい場合は最後の圧縮結果を返します。
            callback(compressed);
        };

        img.onerror = function() {
            alert("写真の読み込みに失敗しました。");
        };

        img.src = e.target.result;
    };

    reader.readAsDataURL(file);
}


/* =========================
   分布を追加
========================= */

function addCustomDistribution() {

    const input =
        document.getElementById(
            "customDistribution"
        );

    const value =
        input.value.trim();

    if (!value) {

        alert("分布を入力してください。");

        return;

    }

    addDistributionName(value);

    input.value = "";

}


/* =========================
   分布名を登録
========================= */

function addDistributionName(name) {

    if (
        !selectedDistributions.includes(name)
    ) {

        selectedDistributions.push(name);

    }

    showSelectedDistributions();

}


/* =========================
   登録分布表示
========================= */

function showSelectedDistributions() {

    const area =
        document.getElementById(
            "selectedDistributions"
        );

    area.innerHTML = "";


    if (
        selectedDistributions.length === 0
    ) {

        area.innerHTML =
            "まだ登録されていません。";

        return;

    }


    selectedDistributions.forEach(
        function(name, index) {

            const span =
                document.createElement("span");

            span.className = "tag";

            span.textContent = name;


            const remove =
                document.createElement("button");

            remove.textContent = "×";

            remove.className =
                "remove-tag";


            remove.onclick = function() {

                selectedDistributions
                    .splice(index, 1);

                showSelectedDistributions();

            };


            span.appendChild(remove);

            area.appendChild(span);

        }
    );

}


/* =========================
   登録フォーム表示
========================= */

function showForm() {

    editingIndex = -1;

    selectedPhoto = "";

    selectedDistributions = [];

    selectedColor = "";


    document.getElementById("formTitle")
        .textContent =
        "新しい生物を登録";


    document.getElementById("form")

    document.getElementById("japaneseName")

    document.getElementById("scientificName")
        .value = "";

    document.getElementById("kingdom")
        .value = "";

    document.getElementById("phylum")
        .value = "";

    document.getElementById("className")
        .value = "";

    document.getElementById("order")
        .value = "";

    document.getElementById("family")
        .value = "";

    document.getElementById("customDistribution")
        .value = "";

    document.getElementById("description")

    document.getElementById("photo")

}


/* =========================
   フォームを閉じる
========================= */

function hideForm() {

    document.getElementById("form")

}


/* =========================
   保存
========================= */

function saveData() {

    const japaneseName =
        document.getElementById(
            "japaneseName"
        ).value.trim();


    const scientificName =
        document.getElementById(
            "scientificName"
        ).value.trim();


    if (!japaneseName) {

        document.getElementById("saveMessage").textContent = "和名を入力してください。";
        return;

    }


    if (!scientificName) {

        document.getElementById("saveMessage").textContent = "学名を入力してください。";
        return;

    }


    if (!selectedColor) {

        document.getElementById("saveMessage").textContent = "色を1つ選択してください。";
        return;

    }


    const existingOrganisms = getOrganisms();

    const organismId =
        editingIndex >= 0 && existingOrganisms[editingIndex] && existingOrganisms[editingIndex].id
            ? existingOrganisms[editingIndex].id
            : (window.crypto && crypto.randomUUID
                ? crypto.randomUUID()
                : "org_" + Date.now() + "_" + Math.random().toString(36).slice(2));

    const organism = {

        id:
            organismId,

        japaneseName:
            japaneseName,

        scientificName:
            scientificName,

        color:
            selectedColor,

        taxonomy: {

            kingdom:
                document.getElementById(
                    "kingdom"
                ).value.trim(),

            phylum:
                document.getElementById(
                    "phylum"
                ).value.trim(),

            className:
                document.getElementById(
                    "className"
                ).value.trim(),

            order:
                document.getElementById(
                    "order"
                ).value.trim(),

            family:
                document.getElementById(
                    "family"
                ).value.trim()

        },

        distributions:
            selectedDistributions.slice(),

        description:
            document.getElementById(
                "description"
            ).value.trim(),

        photo:
            selectedPhoto

    };


    const photoFile =
        document.getElementById(
            "photo"
        ).files[0];


    if (photoFile) {

        compressImage(
            photoFile,
            function(compressedPhoto) {

                organism.photo =
                    compressedPhoto;

                actuallySave(
                    organism
                );

            }
        );

    } else {

        actuallySave(
            organism
        );

    }

}


/* =========================
   実際に保存
========================= */

function actuallySave(organism) {

    let organisms = getOrganisms();

    if (editingIndex >= 0) {
        organisms[editingIndex] = organism;
    } else {
        organisms.push(organism);
    }

    try {
        setOrganisms(organisms);
        editingIndex = -1;
        hideForm();
        showList();
    } catch (error) {
        console.error("local save error:", error);
        alert("PCへの保存に失敗しました。\\n" + (error.message || error));
        return;
    }

    const saveMessage = document.getElementById("saveMessage");
    if (saveMessage) saveMessage.textContent = "保存しました。";

    if (currentUser) {
        saveCloudData(true);
    }
}


/* =========================

function showList() {

    const area =
        document.getElementById(
            "listArea"
        );

    area.innerHTML =
        "<h2>生物一覧</h2>" +
        `
        <div class="organism-search-box">
            <input
                type="text"
                id="organismSearchInput"
                placeholder="和名・学名を入力"
            >
            <button
                type="button"
                id="organismSearchButton"
            >
                検索
            </button>
            <button
                type="button"
                id="organismClearButton"
            >
                クリア
            </button>
        </div>

        <div id="organismSearchResults"></div>

        <div id="organismList"></div>
        `;


    area.innerHTML =
        "<h2>生物一覧</h2>";


    let entries =
        getEntries();


    entries =
        sortEntries(entries);


    if (entries.length === 0) {

        area.innerHTML +=
            "<p>まだ生物が登録されていません。</p>";

        showTaxonomyButtons();

        return;

    }


    entries.forEach(
        function(entry) {

            area.appendChild(
                createSearchResult(
                    entry.organism,
                    entry.index
                )
            );

        }
    );


    showTaxonomyButtons();


    const searchButton =
        document.getElementById(
            "organismSearchButton"
        );

    const clearButton =

function showTaxonomyButtons() {

    const area =
        document.getElementById(
            "taxonomyButtons"
        );


    area.innerHTML = "";


    const organisms =
        JSON.parse(
            localStorage.getItem(
                "organisms"
            )
        ) || [];


    const types = [

        {
            key: "kingdom",
            name: "界"
        },

        {
            key: "phylum",
            name: "門"
        },

        {
            key: "className",
            name: "綱"
        },

        {
            key: "order",
            name: "目"
        },

        {
            key: "family",
            name: "科"
        }

    ];


    types.forEach(
        function(type) {

            const values = [];


            organisms.forEach(
                function(organism) {

                    let value = "";


                    if (
                        organism.taxonomy
                    ) {

                        value =
                            organism.taxonomy[
                                type.key
                            ] || "";

                    }


                    if (
                        !value &&
                        organism[type.key]
                    ) {

                        value =
                            organism[type.key];

                    }


                    if (
                        value &&
                        !values.includes(value)
                    ) {

                        values.push(value);

                    }

                }
            );


            if (values.length === 0) {

                return;

            }


            const heading =
                document.createElement("h3");

            heading.textContent =
                type.name;


            area.appendChild(
                heading
            );


            values.forEach(
                function(value) {

                    const button =
                        document.createElement(
                            "button"
                        );

                    button.textContent =
                        value;


                    button.onclick =
                        function() {

                            showTaxonomy(
                                type.key,
                                type.name,
                                value
                            );

                        };


                    area.appendChild(
                        button
                    );

                }
            );

        }
    );


    if (!area.innerHTML) {

        area.textContent =
            "まだ分類が登録されていません。";

    }

}

async function login() {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const message = document.getElementById("loginMessage");

    if (!email || !password) {
        message.textContent = "メールアドレスとパスワードを入力してください。";
        return;
    }

    message.textContent = "ログインしています…";

    try {
        await signInWithEmailAndPassword(auth, email, password);
        message.textContent = "ログイン成功。画面を切り替えています…";
    } catch (error) {
        console.error(error);
        const code = error && error.code ? error.code : "コードなし";
        const detail = error && error.message ? error.message : String(error);
        message.textContent = "ログインできませんでした。\nFirebaseエラー: " + code + "\n詳細: " + detail;
    }
}

    await signOut(auth);
}

function removePhotosForCloud(organisms) {
    return organisms.map(function(organism) {
        const copy = JSON.parse(JSON.stringify(organism));
        copy.photo = "";
        return copy;
    });
}

async function savePhotoToCloud(organism) {

    if (!currentUser || !organism || !organism.id || !organism.photo) {
        return;
    }

    // 写真は親ドキュメントとは別のサブコレクションへ保存します。
    // これにより生物データ全体が1MiBを超えるのを防ぎます。
    const photoRef = doc(
        db,
        "organisms",
        currentUser.uid,
        "photos",
        organism.id
    );

    await setDoc(photoRef, {
        photo: organism.photo,
        updatedAt: Date.now()
    });
}

async function loadPhotoFromCloud(organism) {

    if (!currentUser || !organism || !organism.id) {
        return organism;
    }

    const photoRef = doc(
        db,
        "organisms",
        currentUser.uid,
        "photos",
        organism.id
    );

    const snapshot = await getDoc(photoRef);

    if (snapshot.exists()) {
        const data = snapshot.data();
        if (data && data.photo) {
            organism.photo = data.photo;
        }
    }

    return organism;
}

async function saveCloudData(showError = false) {

    if (!currentUser || savingToCloud) return false;

    savingToCloud = true;

    try {
        let organisms = getOrganisms();

        // 古いデータにも写真用IDを付けます。
        organisms = organisms.map(function(organism, index) {
            const copy = JSON.parse(JSON.stringify(organism));
            if (!copy.id) {
                copy.id = "org_" + index + "_" + Date.now();
            }
            return copy;
        });

        setOrganisms(organisms);

        const ref = doc(db, "organisms", currentUser.uid);
        await setDoc(ref, {
            organisms: removePhotosForCloud(organisms)
        });

        for (let i = 0; i < organisms.length; i++) {
            if (organisms[i].photo) {
                document.getElementById("syncMessage").textContent =
                    "写真をクラウドへ保存しています…（" + (i + 1) + "/" + organisms.length + "）";
                await savePhotoToCloud(organisms[i]);
            }
        }

        document.getElementById("syncMessage").textContent =
            "クラウドと同期済みです。";
        return true;

    } catch (error) {
        console.error("Firestore save error:", error);
        const code = error && error.code ? error.code : "unknown";
        const detail = error && error.message ? error.message : String(error);

        document.getElementById("syncMessage").textContent =
            "クラウドへの保存に失敗しました（" + code + "）。";

        if (showError) {
            alert("PCには保存できました。\n\nFirebaseへの同期だけ失敗しました。\n\nエラーコード：" + code + "\n詳細：" + detail);
        }
        return false;

    } finally {
        savingToCloud = false;
    }
}

async function loadCloudData() {

    if (!currentUser) return;

    const message = document.getElementById("syncMessage");
    message.textContent = "クラウドからデータを読み込んでいます…";

    try {
        const ref = doc(db, "organisms", currentUser.uid);
        const snapshot = await getDoc(ref);

        if (snapshot.exists()) {

            const data = snapshot.data();
            let cloud = Array.isArray(data.organisms)
                ? data.organisms
                : [];

            const local = getOrganisms();

            // 古いクラウドデータにはIDがないため、まずIDを付けます。
            cloud = cloud.map(function(item, index) {
                const copy = JSON.parse(JSON.stringify(item));
                if (!copy.id) {
                    if (local[index] && local[index].id) {
                        copy.id = local[index].id;
                    } else {
                        copy.id = "org_" + index + "_" + Date.now();
                    }
                }

                // PC側にだけ写真が残っている場合は一時的に引き継ぎます。
                if (!copy.photo && local[index] && local[index].photo) {
                    copy.photo = local[index].photo;
                }

                return copy;
            });

            // 写真を別ドキュメントから読み込みます。
            for (let i = 0; i < cloud.length; i++) {
                message.textContent =
                    "写真をクラウドから読み込んでいます…（" + (i + 1) + "/" + cloud.length + "）";
                await loadPhotoFromCloud(cloud[i]);
            }

            setOrganisms(cloud);

            // PC側に残っていた写真を、写真用ドキュメントへ移します。
            await saveCloudData();

        } else {

            // 初回ログイン：現在のPCのデータをクラウドへ保存
            await saveCloudData();
        }

        message.textContent = "クラウドと同期済みです。";
        showList();

    } catch (error) {
        console.error(error);
        const code = error && error.code ? error.code : "unknown";
        const detail = error && error.message ? error.message : String(error);
        message.textContent = "クラウドとの同期に失敗しました。";
        alert("クラウドとの同期に失敗しました。\n\nエラーコード：" + code + "\n詳細：" + detail);
    }
}

    const keyword =
        input.value.trim().toLowerCase();

    const entries = getEntries();

    resultsArea.innerHTML = "";

    if (keyword === "") {
        return;
    }

    const results = entries.filter(function(entry) {
        const organism = entry.organism || {};

        const japaneseName =
            String(
                organism.japaneseName || ""
            ).toLowerCase();

        const scientificName =
            String(
                organism.scientificName || ""
            ).toLowerCase();

        return (
            japaneseName.includes(keyword) ||
            scientificName.includes(keyword)
        );
    });

    if (results.length === 0) {
        resultsArea.innerHTML =
            "<p>該当する生物が見つかりませんでした。</p>";
        return;
    }

    results.forEach(function(entry) {
        const organism = entry.organism || {};

        const result =
            document.createElement("div");

        result.className =
            "organism-search-result";

        const name =
            document.createElement("strong");

        name.textContent =
            organism.japaneseName ||
            "和名未登録";

        const scientific =
            document.createElement("em");

        scientific.textContent =
            organism.scientificName ||
            "学名未登録";

        const detailButton =
            document.createElement("button");

        detailButton.type = "button";
        detailButton.textContent = "詳細";

        detailButton.addEventListener(
            "click",
            function() {
                showDetail(entry.index);
            }
        );

        result.appendChild(name);
        result.appendChild(
            document.createElement("br")
        );
        result.appendChild(scientific);
        result.appendChild(
            document.createElement("br")
        );
        result.appendChild(detailButton);

        resultsArea.appendChild(result);
    });
}

function clearOrganismSearch() {
    const input =
        document.getElementById(
            "organismSearchInput"
        );

    const resultsArea =
        document.getElementById(
            "organismSearchResults"
        );

    if (input) {
        input.value = "";
    }

    if (resultsArea) {
        resultsArea.innerHTML = "";
    }
}


</script>
